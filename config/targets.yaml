#
#  Fields:
#    name        — human-readable name (publication style)
#    data_id     — filesystem slug = working directory name
#    ra_deg      — right ascension, decimal degrees J2000 (field / pointing centre)
#    dec_deg     — declination, decimal degrees J2000 (field / pointing centre)
#    agn_ra_deg, agn_dec_deg — OPTIONAL nucleus position, only when the
#                   pointing is offset from the AGN (e.g. NGC 4395).  Used to
#                   identify the AGN; defaults to ra_deg / dec_deg.
#    lco_active  — true if currently observed by LCO photometry
#    lt_active   — true if Liverpool Telescope branch is active
#    agn_field_id — 1-based row index of the AGN in apass_pytics.csv
#                   (the field-star catalogue used by ava_calibrate).
#                   NULL / omit if not yet determined.
#    lco_names   — list of all LCO archive OBJECT spellings for this
#                   target.  Used to route incoming daily images to the
#                   correct AGN.  Must match FITS OBJECT keyword exactly.
# ============================================================

