# lcodb configuration. Every run reads this file; edit it and re-run, no code changes needed.

# --- credentials -----------------------------------------------------------
# File holding ONLY your LCO API token (observe.lco.global -> Profile -> API token).
# The env var LCO_TOKEN, if set, takes precedence.
token_file: ~/.lco_token

# --- where the databases live ---------------------------------------------
db_dir: ../data/lcodb                  # relative to this file
spectra_db: spectra.sqlite
photometry_db: photometry.sqlite

# --- which proposals --------------------------------------------------------
proposals:
  # "auto": read your proposals from the observation portal profile every run
  # (new semesters get picked up on their own), keep those matching include_regex.
  # "list": use only the ids in `ids`.
  mode: auto
  include_regex: '^KEY'
  pi_only: true               # auto mode: keep only proposals where you are the PI (if the portal says)
  # always included (co-I projects); in auto mode added to the discovered ones.
  # LCO2014A-001: NGC 5548 during AGN STORM 1 (2014-05 → 08, V band; 1 m SBIG + early Sinistro; public). 18 Nov 2026.
  ids: [KEY2018B-001, KEY2014A-002, LCO2014A-001]
  exclude: []

# --- what `lcodb daily` crawls ------------------------------------------------
# The daily sync looks for new frames only in proposals the portal marks active whose id matches include_regex
# (the standards sources are always kept). Inactive or older proposals are left alone: crawl one on request with
# `lcodb sync --proposal ID`. (User, 18 Nov 2026: the daily run should look only at the current, 2026 proposals.)
daily:
  include_regex: '^KEY2026'

# Proposals crawled whole for spectrograph standards (science + arcs + lamp flats).
# Older standards live elsewhere (COJ_calib, OGG_calib, LCOEngineering, ...); those are
# found by target name across ALL proposals using standards.names below.
standard_proposals: ['FLOYDS standards']

# --- what to keep -------------------------------------------------------------
# 0 = raw, 91 = BANZAI products (FLOYDS 1d/2d too; 90 = FLOYDS tarballs)
reduction_levels:
  spectra: [0, 91]            # raw for the re-reduction, 91 to compare with the archive products
  photometry: [90, 91]        # BANZAI (91); old-pipeline (90) kept as fallback, used only when no 91 exists
                              # (frames.is_best / views `images`, `image_quality`)
exclude_obstypes: [GUIDE, EXPERIMENTAL, CATALOG]   # filtered on the server; GUIDE alone is ~90 % of all rows

# Instrument-id prefix -> database. Unknown prefixes are counted and reported, not stored.
instruments:
  spectra: [en]               # FLOYDS (en05, en06, en12)
  # Sinistro (fa; fl = early Sinistro naming), Spectral (fs), MuSCAT (ep), SBIG (kb: the 1 m imagers of 2014-16)
  photometry: [fa, fl, fs, ep, kb]
  # dropped on purpose: guide/acquisition (sd ak kf ef), NRES (nrs), SOAR Goodman (ghts),
  # QHY (sq), other (mc). Move a prefix up to keep it. Dropped frames are counted in state.dropped_frames.
  ignore: [sd, ak, kf, ef, ghts, nrs, sq, mc]
  # Keep a camera only on these telescopes (telescope_id prefix). SBIG: 1 m only (decided 18 Nov 2026);
  # the 0.4 m SBIG cameras share the kb prefix but have another pixel scale and field.
  telescopes:
    kb: [1m0]

# Imaging filters kept in the photometry database (archive names of u B V g r i z Y; user, 18 Nov 2026).
# Frames in other filters (U R I w, narrow-band, air, ...) are listed but not stored (state.dropped_frames).
photometry_filters: [up, B, V, gp, rp, ip, zs, Y]

# --- crawling ---------------------------------------------------------------
page_size: 1000               # anonymous access is capped at 100; the token allows 1000
window_days: 30               # proposals are crawled in time windows of this size
overlap_days: 7               # daily sync re-reads the last N days (late frames / new reductions)
max_retries: 6               # timeouts / connection errors / short 429s
server_error_retries: 1      # HTTP 5xx is NOT transient: retry one request at most this many times ...
server_error_limit: 3        # ... and after this many consecutive failed requests stop the whole step
request_timeout: 180
header_workers: 4
header_rate_per_s: 4        # sustained archive limit seen in Nov 2026; faster gets a multi-hour 429 block
sync_rate_per_s: 2          # archive listing requests (sync, standards and calibration crawls); null = no limit
# DAILY LIMIT (LCO archive docs): 5000 requests/day per logged-in user, UI and API together (3500 anonymous).
# Every HTTP request counts: each listing page, header, search and file download. One token = one shared budget.

# Which frames get their full FITS header downloaded (needed for AIRMASS, seeing, slit, ...).
# Spectra: every frame (a few 10^4). Photometry: the BANZAI frames (all raw keywords plus
# L1FWHM / L1ZP / L1SIGMA ...). Only headers are fetched through the API; no image is downloaded.
headers:
  # Spectra: only the slit width (APERWID, not in the archive listing) is used — arc/flat and standard matching
  # prefer the same slit; airmass has a computed fallback and target linking works from the footprint + name.
  # New frames only (`since`, YYYY-MM-DD): the 14k frames of 2014 – Aug 2021 without a header are not fetched
  # (decided 16 Nov 2026); their matching falls back to same block, then nearest in time.
  spectra: {levels: [0, 91], since: "2021-09-01"}
  photometry: {levels: [90, 91], best_only: true, enabled: false}   # one header per exposure (the best level)
  # photometry headers are OFF (Nov 2026): ~5e5 headers vs the archive rate limit, and the quality numbers come from
  # our own reductions. Set enabled: true (or run `lcodb headers --db photometry`) to backfill later.
  # Only the slit width is kept (decided 19 Nov 2026): one header request per new exposure (raw + products share it),
  # about 8 a day. The full headers are not stored; `lcodb purge-headers --live` deletes the ones stored before.
  columns: [aperwid]
  store_full: false

# --- standard-star matching (spectra DB) ---------------------------------------
standards:
  n_nearest: 5                # standards kept per science frame AND per slit width
  max_dt_days: 60             # search limit; picks beyond preferred_dt_days are labelled wide_window
  preferred_dt_days: 30       # standards within this always win (fixed at 30 d in the spectrum_standards view)
  # Only standards the reduction has a reference spectrum for are matched (B19, 19 Nov 2026): the RA/DEC of the
  # banzai-floyds reference files, within usable_radius_arcsec of the frame footprint centre. Per host; null or a
  # missing folder = no restriction (with a warning).
  reference_dir: ~/astro/floyds/banzai-floyds/banzai_floyds/data/standards
  usable_radius_arcsec: 300   # the footprint centre of a FLOYDS frame is ~165" from the target (113–209" typical)
  window_days: 365            # time windows for the by-name search
  # Flux standards. Frames with these target names are flagged is_standard in any proposal,
  # and are searched for across ALL proposals on the spectrographs (spaces/case ignored).
  names: [FEIGE110, FEIGE34, FEIGE66, FEIGE67, EG21, EG274, EG131, GD108, GD153, GD71, GD50,
          BD+284211, BD+332642, BD+254655, BD+174708, HZ44, HZ2, HZ4, HZ21, G191B2B,
          LTT7987, LTT3218, LTT9491, LTT1020, LTT2415, LTT1788, LTT377, LTT4364, LTT6248, LTT7379,
          CD-32-9927, CD-34-241, HR718, HR3454, HR4468, HR5501, HR7596, HR9087, P177D, P330E,
          L745-46A, EGGR274, LTT9239, FEIGE56, HD49798, CD-34]
  # Observatory calibration programmes: crawled whole for raw FLOYDS frames (spectra, arcs, flats).
  # Their standards often have ad-hoc names, so any raw spectrum within position_radius_arcsec of a
  # known standard is flagged is_standard by `lcodb match` (AVA-linked targets never are).
  calib_proposals: [COJ_calib, OGG_calib]
  calib_instruments: [en05, en06, en12]
  position_radius_arcsec: 120   # FLOYDS footprint centres sit up to ~90" from the star

# --- arcs / lamp flats for every spectrum (science and standards) -------------
calibs:
  n_nearest: 3                # kept per spectrum and per type (ARC, LAMPFLAT)
  max_dt_days: 7

# --- sites, used only when the header airmass is missing ------------------------
sites:
  coj: {lat: -31.2733, lon: 149.0711, height: 1116}
  ogg: {lat: 20.7069, lon: -156.2575, height: 3055}
  lsc: {lat: -30.1674, lon: -70.8048, height: 2198}
  cpt: {lat: -32.3807, lon: 20.8101, height: 1460}
  elp: {lat: 30.6801, lon: -104.0153, height: 2027}
  tfn: {lat: 28.3003, lon: -16.5122, height: 2330}
  tlv: {lat: 30.5958, lon: 34.7633, height: 875}

# --- AVA master target table ---------------------------------------------------
# Every LCO target name is linked to its AVA source (frames.ava_id, table target_link) by `lcodb link`
# (also run by `daily`). Paths are relative to this file.
ava:
  db: ../data/ava.db           # AVA database = master target table (read-only here)
  csv: ../data/ava/ava.csv     # CSV export of it (reference; used only if `db` is absent)
  overrides_csv: ../data/ava/ava_link_overrides.csv   # manual object -> ava_id decisions (empty ava_id = never link)
  radius_arcsec: 30            # requested (header) positions
  radius_footprint_arcsec: 180 # image-centre positions, when no header
