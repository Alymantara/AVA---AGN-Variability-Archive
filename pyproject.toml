[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ava"
version = "0.1.0"
description = "AGN Variability Archive — LCO spectroscopy and photometry pipeline"
authors = [{ name = "Juan Hernandez Santisteban", email = "jvhs1@st-andrews.ac.uk" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # Astronomy
    "astropy>=6.0",
    "astroquery>=0.4.7",
    "astroalign>=2.5",
    # Data / numerics
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "numba>=0.58",
    "lmfit>=1.2",
    "sqlalchemy>=2.0",
    # Plots
    "matplotlib>=3.8",
    "pillow>=10.0",
    # Config, CLI, HTTP
    "pyyaml>=6.0",
    "click>=8.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    # Orchestration (Prefect 3)
    "prefect>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[project.scripts]
# LCO archive database CLI
lcodb = "ava.lcodb.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ava*"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
